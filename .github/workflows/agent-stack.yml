name: Linux Agent stack verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify OpenClaw update coordination in the Linux installer
        run: node --test deployment/install-agent-stack.test.mjs

      - name: Verify OpenClaw service connector update preflight
        run: node --test deployment/openclaw-service-integration.test.mjs

      - name: Verify offline orchestration Mock fixtures
        run: |
          node --test \
            experiments/orchestration-comparison-v2/candidate-profile-contract.test.mjs \
            experiments/orchestration-comparison-v2/mock-household-harness.test.mjs \
            experiments/orchestration-comparison-v2/experiment-api-key-linux.test.mjs
          bash -n experiments/orchestration-comparison-v2/tools/dry_run_profiles_linux.sh
          bash -n experiments/orchestration-comparison-v2/tools/experiment-api-key-linux.sh
          node experiments/orchestration-comparison-v2/mock-household-harness.mjs

      - name: Install device-manager direct dependencies for Mock tests
        run: npm install --no-save --package-lock=false --omit=peer --legacy-peer-deps --ignore-scripts
        working-directory: device-manager

      - name: Install target OpenClaw SDK for adapter tests
        run: npm install --no-save --package-lock=false --include=peer --ignore-scripts openclaw@2026.7.1-2
        working-directory: device-manager

      - name: Dry-run all four orchestration profiles with target OpenClaw
        run: |
          PATH="$GITHUB_WORKSPACE/device-manager/node_modules/.bin:$PATH" \
            bash experiments/orchestration-comparison-v2/tools/dry_run_profiles_linux.sh all

      - name: Install orchestrator direct dependencies for Mock tests
        run: npm install --no-save --package-lock=false --omit=peer --legacy-peer-deps --ignore-scripts
        working-directory: multi-agent-orchestrator

      - name: Validate device-manager OpenClaw plugin
        run: node_modules/.bin/openclaw plugins validate --root . --entry ./src/openclaw-plugin.js
        working-directory: device-manager

      - name: Validate platform-orchestrator OpenClaw plugin
        run: ../device-manager/node_modules/.bin/openclaw plugins validate --root . --entry ./src/openclaw-platform-plugin.js
        working-directory: multi-agent-orchestrator

      - name: Verify Profile sync contracts and Linux SQLite behavior
        run: |
          node --check agent-memory/examples/profile-sync-linux-key-provider-smoke.js
          node --test \
            agent-memory/test/profile-consent-prototype.test.js \
            agent-memory/test/profile-consent-sqlite-prototype.test.js \
            agent-memory/test/profile-sync-engine.test.js \
            agent-memory/test/profile-sync-http.test.js \
            agent-memory/test/profile-sync-local-http-server.test.js \
            agent-memory/test/profile-sync-key-derivation.test.js \
            agent-memory/test/profile-sync-linux-secret-service-provider.test.js \
            agent-memory/test/profile-sync-sqlite-path.test.js
          node agent-memory/examples/profile-sync-local-e2e-prototype.js

      - name: Run Linux local and Mock verification suite
        run: node deployment/verify-agent-stack.mjs
